<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Warta Menu</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* PALET WARNA SESUAI REQUEST */
        :root { 
            --primary: #174E4F; 
            --accent: #F3E5C3; 
            --secondary: #ffa000;
            --dark: #0b2a2a;
        }
        
        body { background-color: var(--accent); font-family: 'Segoe UI', sans-serif; margin: 0; }
        
        .admin-header { 
            background: var(--primary); 
            padding: 20px; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            color: var(--accent);
        }
        
        .admin-content { max-width: 500px; margin: 0 auto; padding: 20px; padding-bottom: 100px; }
        
        .order-card { 
            background: white; 
            border-radius: 25px; 
            padding: 20px; 
            margin-bottom: 20px; 
            box-shadow: 0 8px 20px rgba(23, 78, 79, 0.1); 
            border: 1px solid rgba(23, 78, 79, 0.05);
            border-left: 8px solid var(--secondary); 
        }
        
        .order-card.selesai { border-left-color: var(--primary); opacity: 0.8; }
        
        .badge-status { font-size: 11px; padding: 6px 14px; border-radius: 20px; font-weight: bold; text-transform: uppercase; }
        .bg-masuk { background: #fff3e0; color: #ef6c00; }
        .bg-selesai { background: #e8f5e9; color: #2e7d32; }
        
        .text-location { color: var(--primary); font-weight: bold; font-size: 13px; display: block; margin-top: 4px; }
        
        .item-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; border-bottom: 1px dashed #eee; padding-bottom: 5px; }
        
        .btn-action { border-radius: 15px; font-weight: bold; padding: 14px; margin-top: 15px; width: 100%; border: none; transition: 0.3s; }
        .btn-done { background: var(--primary); color: var(--accent); }
        .btn-done:active { transform: scale(0.95); }
        
        .btn-del { background: #ffebee; color: #c62828; margin-top: 12px; font-size: 13px; }
        
        #audio-panel .btn-warning { background-color: var(--secondary); border: none; color: white; border-radius: 18px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="admin-header">
    <div class="container d-flex justify-content-between align-items-center" style="max-width: 460px; margin: 0 auto;">
        <h4 class="fw-bold m-0">Pesanan Masuk</h4>
        <span id="order-count" class="badge rounded-pill px-3 py-2" style="background: var(--accent); color: var(--primary);">0</span>
    </div>
</div>

<div class="admin-content">
    <div id="audio-panel" class="mb-4">
        <button id="btn-audio" class="btn btn-warning w-100 fw-bold shadow-sm py-3" onclick="aktifkanSuara()">
            🔔 AKTIFKAN NOTIFIKASI SUARA
        </button>
        <p class="text-center mt-2 small" style="color: var(--primary); font-weight: 500;">Wajib diklik agar Safari/Chrome mengizinkan suara</p>
    </div>

    <div id="admin-order-list">
        <div class="text-center text-muted py-5">Menghubungkan ke server...</div>
    </div>
</div>

<audio id="notif-sound" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
</audio>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyAivSWrd8k-7lRDiqkyzauvcas7pndxhg",
      authDomain: "warta-menu-e8351.firebaseapp.com",
      databaseURL: "https://warta-menu-e8351-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "warta-menu-e8351",
      storageBucket: "warta-menu-e8351.firebasestorage.app",
      messagingSenderId: "661469070998",
      appId: "1:661469070998:web:618c7b8852094a8b52e4b7",
      measurementId: "G-BX79RL4FGX"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    let lastOrderCount = 0;
    let audioEnabled = false;

    function aktifkanSuara() {
        const sound = document.getElementById('notif-sound');
        sound.play().then(() => {
            sound.pause();
            sound.currentTime = 0;
            audioEnabled = true;
            document.getElementById('audio-panel').innerHTML = `
                <div class="alert text-center rounded-4 fw-bold small py-2 mb-0" style="background: var(--primary); color: var(--accent);">
                    ✅ Notifikasi Suara Siaga
                </div>`;
        }).catch(err => {
            alert("Gagal aktifkan suara. Silakan klik ulang.");
        });
    }

    db.ref('pesanan').on('value', (snapshot) => {
        const list = document.getElementById('admin-order-list');
        const count = document.getElementById('order-count');
        const data = snapshot.val();

        if (!data) {
            list.innerHTML = '<div class="text-center text-muted py-5">Belum ada pesanan masuk.</div>';
            count.innerText = "0";
            lastOrderCount = 0;
            return;
        }

        const keys = Object.keys(data).reverse();
        const currentCount = keys.length;
        count.innerText = currentCount;

        if (currentCount > lastOrderCount && lastOrderCount !== 0) {
            const sound = document.getElementById('notif-sound');
            if (sound && audioEnabled) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log("Audio diblokir sistem"));
            }
        }
        lastOrderCount = currentCount;

        list.innerHTML = keys.map(key => {
            const ord = data[key];
            const isDone = ord.status === 'Selesai';
            const itemsHtml = (ord.items || []).map(it => {
                const toppingList = (it.tops || []).join(', ') || 'Polos';
                return `
                    <div class="item-row">
                        <span><b class="text-dark">${it.name}</b><br><small class="text-muted">${toppingList}</small></span>
                        <span class="fw-bold text-dark">Rp ${(it.total || 0).toLocaleString()}</span>
                    </div>`;
            }).join('');

            return `
                <div class="order-card ${isDone ? 'selesai' : ''}">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <div>
                            <h5 class="fw-bold m-0" style="color: var(--primary);">${ord.customer || 'Tanpa Nama'}</h5>
                            <span class="text-location">📍 Lokasi: ${ord.location || 'Di tempat'}</span>
                            <small class="text-muted">${ord.waktu || '-'}</small>
                        </div>
                        <span class="badge-status ${isDone ? 'bg-selesai' : 'bg-masuk'}">
                            ${(ord.status || 'MASUK').toUpperCase()}
                        </span>
                    </div>
                    <hr>
                    <div class="mb-3">${itemsHtml}</div>
                    <div class="d-flex justify-content-between fw-bold h5 mb-3">
                        <span class="text-muted small">TOTAL (${ord.payment || 'Cash'})</span>
                        <span style="color: var(--primary);">Rp ${(ord.total || 0).toLocaleString()}</span>
                    </div>
                    ${!isDone ? `
                        <button class="btn-action btn-done shadow" onclick="updateStatus('${key}', 'Selesai')">PESANAN SIAP</button>
                    ` : `
                        <button class="btn-action btn-del" onclick="hapusPesanan('${key}')">HAPUS DARI DAFTAR</button>
                    `}
                </div>`;
        }).join('');
    });

    function updateStatus(id, stat) { db.ref('pesanan/' + id).update({ status: stat }); }
    function hapusPesanan(id) { if(confirm('Hapus pesanan ini?')) { db.ref('pesanan/' + id).remove(); } }
</script>
</body>
</html>
