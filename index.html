<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warta Menu - Digital Ordering</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #174E4F;    /* Teal Gelap */
            --accent: #F3E5C3;     /* Cream/Beige */
            --mint: #fdfaf3;
            --dark: #0b2a2a;
        }
        
        body { background-color: var(--accent); font-family: 'Segoe UI', sans-serif; margin: 0; color: var(--dark); overflow-x: hidden; }
        .app-mobile { max-width: 480px; margin: 0 auto; min-height: 100vh; background: white; position: relative; display: flex; flex-direction: column; }
        .hidden { display: none !important; }
        
        /* HEADER - Diperbaiki agar tidak acak-acakan */
        .header-section { background: var(--primary); height: 110px; border-radius: 0 0 40px 40px; position: relative; display: flex; justify-content: center; z-index: 10; }
        .header-logo { background: var(--accent); padding: 12px 30px; border-radius: 20px; position: absolute; bottom: -20px; box-shadow: 0 10px 25px rgba(23, 78, 79, 0.2); color: var(--primary); font-weight: 900; font-size: 20px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* NAV SCROLL - Diperbaiki agar interaktif */
        .nav-scroll { margin-top: 45px; display: flex; gap: 10px; padding: 15px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; }
        .nav-scroll::-webkit-scrollbar { display: none; }
        .nav-pill { padding: 10px 20px; border-radius: 30px; border: 1.5px solid #eee; background: #f9f9f9; cursor: pointer; white-space: nowrap; font-size: 13px; color: #666; font-weight: 600; transition: 0.3s; flex-shrink: 0; }
        .nav-pill.active { background: var(--primary); color: var(--accent); border-color: var(--primary); box-shadow: 0 5px 15px rgba(23, 78, 79, 0.2); }
        
        .content { flex: 1; padding: 10px 15px 120px 15px; }
        
        /* KARTU MENU - Diperbaiki layout & klik */
        .card-menu { background: white; border-radius: 22px; padding: 15px 20px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #f0f0f0; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: 0.2s; -webkit-tap-highlight-color: transparent; }
        .card-menu:active { transform: scale(0.96); background: var(--mint); }
        .card-menu h6 { margin: 0; font-weight: 700; color: var(--dark); font-size: 15px; }
        .card-menu p { margin: 2px 0 0 0; font-size: 13px; color: #777; }
        
        .btn-plus { 
            background: var(--primary); color: var(--accent); border: none; width: 36px; height: 36px; border-radius: 12px; font-weight: bold; font-size: 22px;
            display: flex; align-items: center; justify-content: center; line-height: 0; padding: 0; pointer-events: none; /* Biar klik kartu yang dominan */
        }

        /* FOOTER CART */
        .footer-cart { position: fixed; bottom: 0; width: 100%; max-width: 480px; background: var(--primary); padding: 20px; border-radius: 30px 30px 0 0; color: var(--accent); z-index: 1000; }
        .footer-cart button { border-radius: 15px; font-weight: 800; padding: 12px; color: var(--primary) !important; background: var(--accent) !important; border: none; }

        /* OVERLAYS */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 42, 42, 0.7); z-index: 2000; display: flex; align-items: flex-end; }
        .sheet { background: white; width: 100%; max-width: 480px; border-radius: 35px 35px 0 0; padding: 30px 25px; animation: slideUp 0.3s ease-out; }
        
        .qris-screen { background: var(--primary); color: var(--accent); min-height: 100vh; text-align: center; padding: 40px 20px; }
        .upload-area { border: 2px dashed var(--accent); padding: 20px; border-radius: 20px; margin: 20px 0; cursor: pointer; }
        
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body>

<div class="app-mobile shadow-lg">
    <div id="page-home">
        <div class="header-section"><div class="header-logo">WARTA MENU</div></div>
        <div class="nav-scroll" id="nav-container"></div>
        <div class="content">
            <h5 class="fw-bold mb-3" id="cat-title">MIE SERIES</h5>
            <div id="menu-list"></div>
        </div>
        <div id="cart-bar" class="footer-cart hidden">
            <div class="d-flex justify-content-between fw-bold mb-3">
                <span id="qty-text">0 item</span>
                <span id="total-text">Rp 0</span>
            </div>
            <button class="btn btn-light w-100" onclick="showCheckout()">LIHAT PESANAN</button>
        </div>
    </div>

    <div id="page-checkout" class="hidden p-4 bg-white" style="min-height: 100vh;">
        <div class="d-flex align-items-center mb-4">
            <button class="btn btn-light rounded-circle me-3" onclick="hideCheckout()">✕</button>
            <h5 class="fw-bold m-0">Detail Pesanan</h5>
        </div>
        <div class="mb-3">
            <label class="fw-bold text-muted small mb-2">Nama Pemesan</label>
            <input type="text" id="customer-name" class="form-control py-3 rounded-4 bg-light border-0 px-4" placeholder="Ketik nama kamu...">
        </div>
        <div class="mb-4">
            <label class="fw-bold text-muted small mb-2">Lokasi / Nomor Meja (Opsional)</label>
            <input type="text" id="customer-location" class="form-control py-3 rounded-4 bg-light border-0 px-4" placeholder="Contoh: Meja 5...">
        </div>
        <div id="checkout-items" class="mb-4"></div>
        <h6 class="fw-bold text-muted mb-3 small">Metode Pembayaran</h6>
        <div class="d-flex gap-3 mb-4">
            <div id="pill-cash" class="nav-pill active flex-fill text-center py-3" onclick="setPayment('Cash', this)">Cash</div>
            <div id="pill-qris" class="nav-pill flex-fill text-center py-3" onclick="setPayment('QRIS', this)">QRIS</div>
        </div>
        <div class="mt-auto border-top pt-4">
            <div class="d-flex justify-content-between h5 fw-bold mb-4">
                <span>Total</span><span id="checkout-total-text">Rp 0</span>
            </div>
            <button class="btn w-100 py-3 rounded-4 fw-bold shadow" style="background: var(--primary); color: var(--accent);" onclick="processPayment()">KONFIRMASI PESANAN</button>
        </div>
    </div>

    <div id="page-qris" class="qris-screen hidden">
        <div class="d-flex justify-content-between mb-4"><h5 class="fw-bold">Pembayaran QRIS</h5><span onclick="showCheckout()" style="cursor:pointer">✕</span></div>
        <div class="bg-white p-4 d-inline-block rounded-4 mb-4 shadow-lg">
            <img src="WARTA QRIS.jpeg" width="220" class="rounded-2">
        </div>
        <h2 class="fw-bold mb-4" id="qris-total-display">Rp 0</h2>
        <div class="upload-area" onclick="document.getElementById('upload-ss').click()">
            <p class="small fw-bold mb-2">Upload Bukti Screenshot</p>
            <input type="file" id="upload-ss" accept="image/*" class="hidden" onchange="previewImage(this)">
            <div id="preview-container" class="hidden mt-2"><img id="preview-ss" src="#" class="img-fluid rounded-3" style="max-height: 150px;"></div>
            <span id="upload-placeholder" class="small opacity-75">Klik untuk pilih foto</span>
        </div>
        <button id="btn-konfirmasi-qris" class="btn btn-light fw-bold w-100 py-3 rounded-4 disabled" style="color: var(--primary)" onclick="finishOrder('QRIS')">KONFIRMASI PEMBAYARAN</button>
    </div>

    <div id="page-success" class="overlay hidden" style="align-items: center; justify-content: center; padding: 20px;">
        <div class="bg-white rounded-5 p-5 text-center shadow-lg w-100" style="max-width: 400px;">
            <div class="h1 text-success mb-3">✓</div>
            <h4 class="fw-bold">Berhasil!</h4>
            <p class="text-muted small">Pesanan Anda telah diterima dan sedang diproses.</p>
            <button class="btn w-100 py-3 mt-3 rounded-4 fw-bold" style="background: var(--primary); color: var(--accent);" onclick="location.reload()">OKAY</button>
        </div>
    </div>

    <div id="overlay-addon" class="overlay hidden"><div class="sheet" id="addon-content"></div></div>
</div>

<script>
    // --- FIREBASE CONFIG (Jangan Diubah) ---
    const firebaseConfig = {
      apiKey: "AIzaSyAivSWrd8k-7lRDiqkyzauvcas7pndxhg",
      authDomain: "warta-menu-e8351.firebaseapp.com",
      databaseURL: "https://warta-menu-e8351-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "warta-menu-e8351",
      storageBucket: "warta-menu-e8351.firebasestorage.app",
      messagingSenderId: "661469070998",
      appId: "1:661469070998:web:618c7b8852094a8b52e4b7",
      measurementId: "G-BX79RL4FGX"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    // DATA MENU
    const menus = [
        { name: 'Indomie Goreng', price: 7000, cat: 'mie series', addons: [{name:'Telur', price:4000}, {name:'Keju', price:3000}] },
        { name: 'Indomie Rendang', price: 8000, cat: 'mie series', addons: [{name:'Telur', price:4000}, {name:'Keju', price:3000}] },
        { name: 'Magelangan', price: 15000, cat: 'magelangan', addons: [] },
        { name: 'Iced Good Day', price: 0, cat: 'coffe', addons: [{name:'Carabian', price:7000}, {name:'Chocochinno', price:7000}, {name:'Cappuchino', price:8000}]},
        { name: 'Danca', price: 13000, cat: 'non-coffe', addons: [], desc: 'Dancow & Matcha' },
        { name: 'Dancok', price: 13000, cat: 'non-coffe', addons: [], desc: 'Dancow & Coklat' },
        { name: 'Kentang Goreng', price: 10000, cat: 'snack', addons: [] }
    ];

    let cart = [];
    let currentItem = null;
    let selectedPay = 'Cash';

    // FUNGSI INTERAKTIF
    function changeCategory(cat, el) {
        document.querySelectorAll('.nav-pill').forEach(p => p.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('cat-title').innerText = cat.toUpperCase();
        const filtered = menus.filter(m => m.cat === cat);
        document.getElementById('menu-list').innerHTML = filtered.map(m => `
            <div class="card-menu shadow-sm" onclick="openModal('${m.name}', ${m.price})">
                <div>
                    <h6>${m.name}</h6>
                    ${m.desc ? `<small class="text-muted">${m.desc}</small><br>` : ''}
                    <p>${m.price === 0 ? 'Pilih Varian' : 'Rp ' + m.price.toLocaleString()}</p>
                </div>
                <button class="btn-plus">+</button>
            </div>`).join('');
    }

    function openModal(name, price) {
        const menuData = menus.find(m => m.name === name);
        currentItem = { name, price };
        let addonHtml = menuData.addons.map(a => `
            <div class="d-flex justify-content-between align-items-center mb-2 p-2 rounded-3 bg-light">
                <div class="d-flex align-items-center gap-2">
                    <input type="checkbox" class="addon-cb" value="${a.price}" data-name="${a.name}" onchange="updateAddonTotal()">
                    <span class="small fw-bold">${a.name}</span>
                </div>
                <span class="text-success small fw-bold">+Rp ${a.price.toLocaleString()}</span>
            </div>`).join('') || '<p class="text-muted small text-center py-3">Tidak ada tambahan.</p>';

        document.getElementById('addon-content').innerHTML = `
            <h5 class="fw-bold mb-3">${name}</h5><hr>
            <p class="fw-bold small mb-2 text-muted">VARIAN / TOPPING</p>
            ${addonHtml}
            <div class="d-flex justify-content-between fw-bold h5 my-4 pt-3 border-top">
                <span>Total</span><span id="addon-total-text">Rp ${price.toLocaleString()}</span>
            </div>
            <button class="btn w-100 py-3 rounded-4 fw-bold shadow" style="background: var(--primary); color: var(--accent);" onclick="handleAddToCart()">TAMBAHKAN</button>
            <button class="btn btn-link w-100 text-muted mt-2 small text-decoration-none" onclick="closeAddon()">Batal</button>`;
        document.getElementById('overlay-addon').classList.remove('hidden');
    }

    function updateAddonTotal() {
        let top = 0;
        document.querySelectorAll('.addon-cb:checked').forEach(cb => top += parseInt(cb.value));
        document.getElementById('addon-total-text').innerText = 'Rp ' + (currentItem.price + top).toLocaleString();
    }

    function handleAddToCart() {
        let tops = []; let tPrice = 0;
        document.querySelectorAll('.addon-cb:checked').forEach(cb => {
            tops.push(cb.getAttribute('data-name'));
            tPrice += parseInt(cb.value);
        });
        if (currentItem.price === 0 && tops.length === 0) return alert("Pilih varian rasa!");
        cart.push({ name: currentItem.name, tops: tops, total: currentItem.price + tPrice });
        updateCartBar();
        closeAddon();
    }

    function updateCartBar() {
        const bar = document.getElementById('cart-bar');
        if(cart.length > 0) {
            bar.classList.remove('hidden');
            let t = cart.reduce((s, i) => s + i.total, 0);
            document.getElementById('qty-text').innerText = cart.length + ' item';
            document.getElementById('total-text').innerText = 'Rp ' + t.toLocaleString();
        } else { bar.classList.add('hidden'); }
    }

    function showCheckout() {
        document.getElementById('page-home').classList.add('hidden');
        document.getElementById('page-checkout').classList.remove('hidden');
        const list = document.getElementById('checkout-items');
        list.innerHTML = cart.map(i => `
            <div class="d-flex justify-content-between mb-3 border-bottom pb-2">
                <span><span class="fw-bold">${i.name}</span><br><small class="text-muted">${i.tops.join(', ') || '-'}</small></span>
                <span class="fw-bold">Rp ${i.total.toLocaleString()}</span>
            </div>`).join('');
        document.getElementById('checkout-total-text').innerText = 'Rp ' + cart.reduce((s,i)=>s+i.total,0).toLocaleString();
    }

    function setPayment(m, el) {
        selectedPay = m;
        document.querySelectorAll('#page-checkout .nav-pill').forEach(p => p.classList.remove('active'));
        el.classList.add('active');
    }

    function processPayment() {
        if(!document.getElementById('customer-name').value.trim()) return alert("Isi nama kamu ya!");
        if(selectedPay === 'QRIS') {
            document.getElementById('page-checkout').classList.add('hidden');
            document.getElementById('page-qris').classList.remove('hidden');
            document.getElementById('qris-total-display').innerText = document.getElementById('checkout-total-text').innerText;
        } else { finishOrder('Cash'); }
    }

    function previewImage(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('preview-ss').src = e.target.result;
                document.getElementById('preview-container').classList.remove('hidden');
                document.getElementById('btn-konfirmasi-qris').classList.remove('disabled');
            }
            reader.readAsDataURL(input.files[0]);
        }
    }

    function finishOrder(method) {
        const orderData = {
            customer: document.getElementById('customer-name').value,
            location: document.getElementById('customer-location').value || "Di tempat",
            items: cart,
            total: cart.reduce((s, i) => s + i.total, 0),
            payment: method,
            status: "Masuk",
            waktu: new Date().toLocaleString()
        };
        db.ref('pesanan').push(orderData).then(() => {
            document.getElementById('page-qris').classList.add('hidden');
            document.getElementById('page-checkout').classList.add('hidden');
            document.getElementById('page-success').classList.remove('hidden');
        });
    }

    function hideCheckout() { document.getElementById('page-checkout').classList.add('hidden'); document.getElementById('page-home').classList.remove('hidden'); }
    function closeAddon() { document.getElementById('overlay-addon').classList.add('hidden'); }
    
    // Auto Load Menu
    const cats = ['mie series', 'magelangan', 'coffe', 'non-coffe', 'snack'];
    document.getElementById('nav-container').innerHTML = cats.map((c, i) => `<div class="nav-pill ${i===0?'active':''}" onclick="changeCategory('${c}', this)">${c.toUpperCase()}</div>`).join('');
    window.onload = () => changeCategory('mie series', document.querySelector('.nav-pill'));
</script>
</body>
</html>
